{{ if .Params.tags }}
<div class="flex flex-wrap justify-center gap-2 px-2">
  {{ range $index, $value := (.GetTerms "tags") }}
  <a class="no-underline rounded bg-primary-100 px-2.5 py-0.5 text-xs font-medium text-primary-800 hover:bg-primary-300 dark:bg-primary-900 dark:text-primary-300 dark:hover:bg-primary-700 lg:px-5 lg:py-2" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
  {{ end }}
</div>
{{ end }}
