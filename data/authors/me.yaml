bio: |
  I am a Research and Development Engineer at Farbe Technologies and a
  Volunteer Researcher at the Multidisciplinary AI Research Centre,
  University of Peradeniya.

  My research focuses on generative modelling, computational imaging,
  signal and image processing, and machine learning for real-world sensing
  applications. I am particularly interested in diffusion models, implicit
  neural representations, historical-image restoration, multispectral
  imaging, and theoretically grounded machine-learning methods.

